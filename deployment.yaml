apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-portal

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-portal

  template:
    metadata:
      labels:
        app: student-portal

    spec:
      containers:
      - name: student-portal
        image: student-portal:v1

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 80